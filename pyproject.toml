[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sweatmeter"
description = "CPU/RAM/GPU/VRAM/thermal/power telemetry and static machine profiling; degrades honestly to Unsupported rather than fabricating a value."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Local AI Suite contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "baseaicore>=0.4,<0.5",
]

[project.optional-dependencies]
pynvml = [
    "pynvml>=11,<12",
]
psutil = [
    "psutil>=6,<7",
]
dev = [
    # The optional GPU backend's extra is a *test* dependency too: importing it needs no GPU, and
    # CI must exercise both backends of the GpuReader conformance suite (ADR-0021 §7).
    "pynvml>=11,<12",
    # >=9.0.3 excludes PYSEC-2026-1845 (vulnerable /tmp/pytest-of-{user} handling,
    # affecting pytest through 9.0.2). Both suites pass unchanged on pytest 9.
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<6",
    "pytest-randomly>=3,<4",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
    "import-linter>=2.0,<3",
    "respx>=0.21,<1",
]

[project.urls]
Homepage = "https://github.com/JPKell/SweatMeter"
Documentation = "https://github.com/JPKell/SweatMeter/tree/main/docs"
Changelog = "https://github.com/JPKell/SweatMeter/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/sweatmeter/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sweatmeter"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.import_linter_cache",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.coverage*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# docs/ is a curated copy of the suite documentation; formatting embedded snippets would make the
# package-local copy diverge from its source without improving executable code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "D", "UP", "ANN", "B", "A", "C4", "DTZ", "T20",
    "SIM", "TID", "PTH", "ERA", "PL", "RUF", "S", "BLE", "ARG", "C901",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D1", "PLR2004", "ANN401", "S311"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-m 'not live and not performance'"
markers = [
    "live: requires a real provider/GPU, never in default CI",
    "performance: performance budget assertions, excluded by default",
    "contract: public API/schema conformance in both directions",
    "linux_only: asserts Linux-specific selection; deselected on the tier-3 early-warning runners",
]
testpaths = ["tests"]

[tool.coverage.run]
# The importable name, not the source path: CI installs the built distribution rather than an
# editable checkout (Packaging Standards §4), so coverage must find the package wherever it is
# installed. `paths` folds the two locations into one name in the report.
source = ["sweatmeter"]
branch = true

[tool.coverage.paths]
source = ["src/sweatmeter", "*/site-packages/sweatmeter"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
