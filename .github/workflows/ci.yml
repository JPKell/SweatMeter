name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly hardware job, per Performance Targets §6 and Packaging Standards §5.
    - cron: "0 3 * * *"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff format --check .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/ci.lock
      - run: pip install . --no-deps
      - run: mypy src tests

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/ci.lock
      - run: pip install . --no-deps
      - run: lint-imports

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install --require-hashes -r requirements/ci.lock
      - run: pip install . --no-deps
      - run: pytest -m "not live and not performance" --cov --cov-report=xml

  tests-314-early-warning:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: pip install -e ".[dev]"
      - run: pytest -m "not live and not performance"

  # Tier-3 portability early warning (Cross-Platform Standards §7): every parser is fixture-driven,
  # so the platform-independent subset must pass on Windows and macOS. Non-blocking by design.
  tests-tier3-early-warning:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Deliberately unpinned: ci.lock is resolved on Linux and omits win32-only dependencies,
      # so a hash-checked install could not succeed here. This job warns about portability, not
      # about dependency drift.
      - run: pip install -e ".[dev]"
      - run: pytest -m "not live and not performance and not linux_only"

  # Cross-Platform Standards §7: platform branching may appear only in the factory module and in
  # the platform reader implementations, which this repository keeps under src/sweatmeter/readers/.
  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Platform branching stays inside the factory and reader modules
        run: |
          leaked=$(grep -rnE 'platform\.system\(\)|sys\.platform|os\.name' src/sweatmeter \
            --include='*.py' \
            | grep -v '^src/sweatmeter/platform\.py:' \
            | grep -v '^src/sweatmeter/readers/' || true)
          if [ -n "$leaked" ]; then
            echo "Platform branching outside the factory and reader modules:" >&2
            echo "$leaked" >&2
            exit 1
          fi

  coverage:
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/ci.lock
      - run: pip install . --no-deps
      - run: pytest -m "not live and not performance" --cov --cov-report=term-missing --cov-fail-under=95

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/ci.lock
      - run: pip install . --no-deps
      - run: pytest -m contract

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      # Audit the locked sets, not the job's own environment: a bare `pip-audit` here would
      # inspect an environment containing only pip-audit itself (Security Standards §11).
      - run: pip-audit --require-hashes -r requirements/ci.lock
      - run: pip-audit --require-hashes -r requirements/release.lock
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/release.lock
      - run: python -m build --no-isolation
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  install-check:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - run: pip install dist/*.whl
      - run: python -c "import sweatmeter"
      # Spec §20 acceptance criterion 1: a five-line script prints CPU, RAM, GPU and VRAM using
      # only this package and its one dependency, from the installed wheel.
      - name: Standalone five-line script
        run: |
          python - <<'PY'
          from sweatmeter import TelemetryCollector
          snapshot = TelemetryCollector().snapshot()
          print("CPU", snapshot.cpu_percent, "RAM", snapshot.ram_used_bytes)
          for gpu in snapshot.gpus:
              print("GPU", gpu.index, gpu.utilization_percent, gpu.vram_used_bytes)
          PY

  # Performance Targets §6 and Gold Standard G19: budgets and live hardware checks run nightly on a
  # runner that actually has a GPU, never on the pull-request path.
  nightly-hardware:
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install --require-hashes -r requirements/ci.lock
      - run: pip install . --no-deps
      - run: pytest -m performance
      - run: pytest -m live
